# Cloud build for iOS: Codemagic builds on its Mac, signs with your Apple account and uploads to TestFlight.
# You never need a Mac. Setup steps are in docs/IOS_RELEASE.md.
workflows:
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key you add in Codemagic > Team settings > Integrations.
      app_store_connect: StickmanASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.stickmancrossing.game
      vars:
        # Set your real AdMob iOS app ID here (or as a secret variable) before the store release.
        ADMOB_IOS_APP_ID: ca-app-pub-3940256099942544~1458002511
        # The app's numeric Apple ID (App Store Connect > App Information). Fill in after creating the app.
        APP_STORE_APPLE_ID: "0000000000"
      node: 22
      xcode: latest
    scripts:
      - name: Install and build the game
        script: |
          npm ci || npm install
          npm run build
      - name: Create or update the iOS project
        script: |
          [ -d ios ] || npx cap add ios
          npx cap sync ios
          bash scripts/ios-configure.sh
      - name: Generate app icon and splash
        script: npx capacitor-assets generate --ios --iconBackgroundColor '#f5f8fa' --splashBackgroundColor '#f5f8fa'
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: Build IPA
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
          else
            xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
