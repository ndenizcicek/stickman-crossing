# Builds the Steam (desktop) version for Windows and Linux on GitHub's machines.
# Run it from the repository's Actions tab > "Steam build" > "Run workflow".
# Each run produces downloadable folders ready to upload to Steam (see docs/STEAM_RELEASE.md).
name: Steam build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: desktop:win
            folder: release/win-unpacked
            name: crosswalk-crew-windows
          - os: ubuntu-latest
            script: desktop:linux
            folder: release/linux-unpacked
            name: crosswalk-crew-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.folder }}
          if-no-files-found: error
